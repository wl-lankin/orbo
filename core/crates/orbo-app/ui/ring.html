<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=520, initial-scale=1">
<title>Orbo Ring</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="ring.css">
</head>
<body class="style-classic">
<div id="stage">
  <svg id="svg" viewBox="-260 -260 520 520" width="520" height="520" aria-hidden="true">
    <defs>
      <filter id="glowF" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
      <filter id="glowS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
      <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gSpec" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/>
      </linearGradient>
      <radialGradient id="gLens" cx=".5" cy=".28" r=".8">
        <stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".6" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/>
      </radialGradient>
      <g id="icons" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <symbol id="i-image" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2"/><circle cx="6" cy="7" r="1.2"/><path d="M2.5 12l3.5-3.5 2.5 2.5 2-2 3 3"/></symbol>
        <symbol id="i-video" viewBox="0 0 16 16"><rect x="1.8" y="3.5" width="12.4" height="9" rx="2"/><path d="M6.8 6.2v3.6l3-1.8z"/></symbol>
        <symbol id="i-audio" viewBox="0 0 16 16"><path d="M3 6.5v3M5.7 4v8M8.4 2.5v11M11.1 5v6M13.5 6.8v2.4"/></symbol>
        <symbol id="i-document" viewBox="0 0 16 16"><path d="M4 1.8h5.2L12.5 5v9.2H4z"/><path d="M9 1.8V5.2h3.5M6 8.2h4.4M6 10.8h4.4"/></symbol>
        <symbol id="i-data" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M2 6.5h12M2 9.8h12M6.5 3v10"/></symbol>
        <symbol id="i-archive" viewBox="0 0 16 16"><rect x="2" y="2.8" width="12" height="3.4" rx="1"/><path d="M3 6.2V13h10V6.2M6.5 9h3"/></symbol>
        <symbol id="i-folder" viewBox="0 0 16 16"><path d="M2 4.6A1.4 1.4 0 0 1 3.4 3.2h2.9l1.4 1.6h4.9A1.4 1.4 0 0 1 14 6.2v5.4a1.4 1.4 0 0 1-1.4 1.4H3.4A1.4 1.4 0 0 1 2 11.6z"/></symbol>
        <symbol id="i-cad" viewBox="0 0 16 16"><path d="M2.5 13.5h11M2.5 13.5V2.5M5 11l6.5-6.5M5 11V7.5M5 11h3.5"/><circle cx="11.5" cy="4.5" r="1.4"/></symbol>
        <symbol id="i-model" viewBox="0 0 16 16"><path d="M8 1.8l5.6 3.1v6.2L8 14.2l-5.6-3.1V4.9z"/><path d="M2.4 4.9L8 8l5.6-3.1M8 8v6.2"/></symbol>
        <symbol id="i-typeface" viewBox="0 0 16 16"><path d="M2.5 13.5L6.5 2.5h1l4 11M4 9.5h6"/><path d="M11.5 9.2c.6-.5 1.3-.7 2-.5v4.8"/></symbol>
        <symbol id="i-intent" viewBox="0 0 16 16"><path d="M8 1.8l1.5 4.2 4.2 1.5-4.2 1.5L8 13.2 6.5 9 2.3 7.5 6.5 6z"/></symbol>
        <symbol id="i-ai" viewBox="0 0 16 16"><path d="M6.5 2.2l1.3 3.5 3.5 1.3-3.5 1.3-1.3 3.5-1.3-3.5L1.7 7l3.5-1.3z"/><path d="M12.4 9.6l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></symbol>
        <symbol id="i-chain" viewBox="0 0 16 16"><circle cx="5.6" cy="8" r="3.4"/><circle cx="10.4" cy="8" r="3.4"/></symbol>
      </g>
    </defs>
    <g id="secs"></g>
    <g id="pres"></g>
    <g id="lens" class="lens">
      <circle class="lens-glow" r="58" filter="url(#glowF)"/>
      <circle class="lens-bg" r="62"/>
      <circle class="lens-spec" r="61.4" stroke="url(#gSpec)"/>
      <circle class="lens-edge" r="62"/>
      <g id="needle"><path id="needlePath"/></g>
      <g id="lensText"></g>
    </g>
  </svg>
</div>
<script src="dev-mock.js"></script>
<script src="ring.js"></script>
</body>
</html>
