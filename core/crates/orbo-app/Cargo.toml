[package]
name = "orbo-app"
edition.workspace = true
version.workspace = true

[[bin]]
name = "orbo-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
orbo-core = { path = "../orbo-core" }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
trash = "5"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
window-vibrancy = "0.6"
crossbeam-channel = "0.5"
notify = "8"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSURL", "NSGeometry", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSPasteboard", "NSPasteboardItem", "NSScreen", "NSWindow", "NSView", "NSResponder", "NSApplication", "NSVisualEffectView", "NSGraphics", "NSRunningApplication"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"
windows-version = "0.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemServices",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
