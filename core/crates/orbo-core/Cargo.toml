[package]
name = "orbo-core"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = { version = "0.8", features = ["preserve_order"] }
crossbeam-channel = "0.5"
infer = "0.16"
kamadak-exif = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "ico", "webp", "tga", "qoi", "pnm", "rayon"] }
webp = "0.3"
ravif = { version = "0.11", default-features = false, features = ["threading"] }
rgb = "0.8"
img-parts = "0.3"
csv = "1.3"
calamine = "0.36"
rust_xlsxwriter = "0.100"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
tar = "0.4"
resvg = "0.45"
tiny-skia = "0.11"
flate2 = "1"
lopdf = "0.45"
pdf-extract = "0.12"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
hayro = "0.8"
gltf = { version = "1", default-features = false, features = ["utils", "import"] }
quick-xml = "0.42.0"
ab_glyph = "0.2.32"
ttf-parser = "0.25.1"
wuff = "0.2.9"
ttf2woff2 = { version = "0.14.1", default-features = false }
roxmltree = "0.20"
ureq = { version = "3", default-features = false, features = ["json"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
